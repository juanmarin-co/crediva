[project]
name = "lending-interest-rates"
version = "0.1.0"
description = "Replicate Colombian lending-interest-rate data from Socrata"
readme = "README.md"
authors = [
    { name = "Juan Marín", email = "13415603+juanmarin-co@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
]

[project.scripts]
lending-interest-rates = "lending_interest_rates.cli.app:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.8",
]
